name: Análise das quedas

on:
  schedule:
    - cron: "15 10 * * *" # 7h15 em Brasília, todo dia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletor # não roda junto com o coletor pra não brigar no push
  cancel-in-progress: false

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python analise.py
      - name: Guardar relatório
        run: |
          git config user.name "nicollekippersothe"
          git config user.email "167126609+nicollekippersothe@users.noreply.github.com"
          git add relatorios
          git diff --cached --quiet && exit 0
          git commit -m "relatório $(TZ=America/Sao_Paulo date '+%Y-%m-%d')"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
