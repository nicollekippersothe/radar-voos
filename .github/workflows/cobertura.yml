name: Cobertura Aviasales

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python cobertura.py
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      - name: Guardar relatório
        run: |
          git config user.name "nicollekippersothe"
          git config user.email "167126609+nicollekippersothe@users.noreply.github.com"
          git add relatorios/cobertura-aviasales.json
          git diff --cached --quiet && exit 0
          git commit -m "cobertura do Aviasales"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
