name: Coletor de preços

on:
  schedule:
    - cron: "7,37 * * * *" # a cada 30 minutos
  workflow_dispatch:
    inputs:
      longa:
        description: "Forçar a leitura de 30 dias à frente"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python coletor.py
        env:
          FORCAR_LONGA: ${{ inputs.longa && '1' || '' }}
          # Opcionais. Sem eles o coletor só grava os CSV, como antes.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
      - name: Guardar leituras no repositório
        run: |
          git config user.name "nicollekippersothe"
          git config user.email "167126609+nicollekippersothe@users.noreply.github.com"
          git add dados
          git diff --cached --quiet && exit 0
          git commit -m "leituras $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
