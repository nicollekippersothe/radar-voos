name: Coletor de preços

on:
  schedule:
    - cron: "3,33 * * * *" # a cada 30 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python coletor.py
      - name: Guardar leituras no repositório
        run: |
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add dados/leituras
          git diff --cached --quiet && exit 0
          git commit -m "leituras $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
